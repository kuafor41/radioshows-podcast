name: Update Radio Shows Podcast RSS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the archive backfill or incremental update"
        required: true
        type: choice
        default: incremental
        options: [archive, incremental]
  schedule:
    - cron: "50 * * * *"
  push:
    branches: ["main"]
    paths: ["fetch_feed.py", "requirements.txt", "data/podcast-cover.jpg", ".github/workflows/update-feed.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radioshows-podcast-feed
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FEED_MODE: incremental
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile fetch_feed.py
      - name: Build and validate test RSS
        run: python fetch_feed.py
      - name: Commit feed and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml data/items.json data/test-report.json data/episode-checks.csv data/retry-queue.json data/cover-map.json data/covers data/archive-backfill-complete.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update radio shows podcast test feed"
            git push
          fi
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - uses: actions/deploy-pages@v5
        id: deployment
