name: Update Radio Shows Podcast RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "50 * * * *"
  push:
    branches: ["main"]
    paths: ["fetch_feed.py", "requirements.txt", "README.md", "data/podcast-cover.jpg", ".github/workflows/update-feed.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: read

concurrency:
  group: radioshows-podcast-feed
  # Queue important RSS runs instead of canceling a run that is already publishing.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    env:
      FEED_MODE: incremental
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      HOURLY_REPORT_ENABLED: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'true' || 'false' }}
    steps:
      - name: Start workflow runtime clock
        run: |
          echo "WORKFLOW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "[RUNTIME] workflow_started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile fetch_feed.py
      - name: Build and validate RSS
        id: build
        run: python fetch_feed.py
      - name: Commit feed and diagnostics
        if: always() && steps.build.outcome != 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- rss.xml data/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update radio shows podcast feed and CSV diagnostics"
            git push
          fi
      - name: Alert if retry queue has long-waiting episodes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import csv, datetime, subprocess
          from pathlib import Path
          p=Path("data/retry-queue.csv")
          if not p.exists(): raise SystemExit(0)
          with p.open(encoding="utf-8-sig",newline="") as f: rows=list(csv.DictReader(f))
          now=datetime.datetime.now(datetime.timezone.utc); old=[]
          for r in rows:
              try:
                  d=datetime.datetime.fromisoformat((r.get("first_failed_at") or "").replace("Z","+00:00"))
                  if (now-d).total_seconds() >= 7*86400: old.append(r)
              except ValueError: pass
          if old:
              title="[RSS ALERT] Episodes stuck in retry queue"
              existing=subprocess.run(["gh","issue","list","--state","open","--search",title,"--json","title","--jq",".[].title"],capture_output=True,text=True).stdout
              if title not in existing:
                  body=f"{len(old)} episode(s) have been in the retry queue for at least 7 days. Total queue: {len(rows)}. See data/retry-queue.csv and data/run-report.csv."
                  subprocess.run(["gh","issue","create","--title",title,"--body",body],check=False)
              print(f"::warning title=Long retry queue::{len(old)} episodes have waited at least 7 days.")
          PY
      - name: Alert after three consecutive failed workflow runs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/workflows/update-feed.yml/runs?per_page=10",
            headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          try:
              data=json.load(urllib.request.urlopen(req,timeout=15))
              runs=[r for r in data.get("workflow_runs",[]) if r.get("status")=="completed"]
              consecutive=0
              for r in runs:
                  if r.get("conclusion")=="failure": consecutive+=1
                  else: break
              if consecutive>=3:
                  title="[RSS ALERT] Three consecutive workflow failures"
                  existing=subprocess.run(["gh","issue","list","--state","open","--search",title,"--json","title","--jq",".[].title"],capture_output=True,text=True).stdout
                  if title not in existing:
                      body=f"The RSS workflow has failed {consecutive} consecutive times. Latest run: {os.environ.get('GITHUB_SERVER_URL')}/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}. Please inspect the run logs."
                      subprocess.run(["gh","issue","create","--title",title,"--body",body],check=False)
          except Exception as e:
              print(f"Could not evaluate consecutive failures for alerting: {e}")
          PY
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Report end-to-end workflow runtime
        if: always()
        run: |
          finished_at=$(date +%s)
          started_at="${WORKFLOW_STARTED_AT:-$finished_at}"
          duration=$((finished_at - started_at))
          finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "[RUNTIME] workflow_duration_seconds=$duration"
          echo "[RUNTIME] workflow_finished_at_utc=$finished_utc"
          {
            echo "### Workflow runtime"
            echo "- Started (epoch seconds): ${WORKFLOW_STARTED_AT:-unknown}"
            echo "- Finished (UTC): $finished_utc"
            echo "- End-to-end duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
