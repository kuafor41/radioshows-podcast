name: Remove obsolete AIMP test branch
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/delete-aimp-test-branch-once.yml"

permissions:
  contents: write

concurrency:
  group: one-time-aimp-test-branch-deletion
  cancel-in-progress: false

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete obsolete AIMP test branch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete test/aimp-podcast-guid
          rm .github/workflows/delete-aimp-test-branch-once.yml
          git add -A .github/workflows/delete-aimp-test-branch-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time branch deletion workflow"
          git push origin HEAD:main
